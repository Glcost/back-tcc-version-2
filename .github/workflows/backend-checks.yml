name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api-and-transactions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated API test dependencies
        run: python -m pip install Flask PyJWT "psycopg[binary]"
      - name: API and authorization regressions (no remote database)
        run: python -m unittest discover -s tests -v
      - name: Parse Python sources
        run: python -m compileall -q src app.py auth.py
      - name: Apply migration to disposable PostgreSQL and test atomic operations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d roar_test -v ON_ERROR_STOP=1 -f tests/learning_fixture.sql
          psql -h localhost -U postgres -d roar_test -v ON_ERROR_STOP=1 -f migrations/20261104_learning_reliability.sql
          psql -h localhost -U postgres -d roar_test -v ON_ERROR_STOP=1 -f tests/learning_transactions.sql
      - name: Concurrent purchases and rewards on disposable PostgreSQL
        env:
          ROAR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/roar_test
          ROAR_ALLOW_DISPOSABLE_DB: 'yes'
        run: python -m unittest discover -s tests -p test_learning_postgres.py -v
