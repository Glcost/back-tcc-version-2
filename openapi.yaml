openapi: 3.0.0
info:
  title: Roar API
  description: API de integração para a plataforma de EdTech Roar (TCC) - Gestão de módulos, jogos customizados e telemetria de desempenho.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Servidor de Desenvolvimento Local
  - url: https://back-tcc-version-2.vercel.app
    description: Servidor de Produção (Vercel)

tags:
  - name: Alunos
    description: Endpoints relacionados ao fluxo do estudante e telemetria
  - name: Professores
    description: Gerenciamento de alunos, turmas e relatórios de progresso
  - name: Atividades
    description: Motor do jogo e listagem de conteúdos pedagógicos
  - name: Relatorios
    description: Módulo de BI - agregações e dashboards de desempenho
  - name: Privacidade
    description: Exportações assistidas e acompanhamento de solicitações de dados

paths:
  # --- TAG: ALUNOS ---
  /api/aluno/login:
    post:
      tags:
        - Alunos
      summary: Realiza o login do aluno via PIN e e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pin_acesso
                - email
              properties:
                pin_acesso:
                  type: string
                  example: "1234"
                email:
                  type: string
                  example: "leandro@escola.com"
      responses:
        '200':
          description: Login efetuado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: "Login aceito!"
                  aluno:
                    type: object
        '400':
          description: Campos obrigatórios ausentes
        '401':
          description: Credenciais inválidas
        '500':
          description: Erro interno no processamento

  /api/aluno/perfil/{aluno_id}:
    get:
      tags:
        - Alunos
      summary: Obtém metadados de UI/UX customizados do perfil do aluno
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Dados de perfil recuperados com sucesso
        '404':
          description: Aluno não encontrado
        '500':
          description: Erro interno

  /api/desempenho:
    post:
      tags:
        - Alunos
      summary: Registra a telemetria e métricas de uma atividade realizada pelo aluno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aluno_id
                - atividade_id
                - modo_utilizado
                - quantidade_erros
                - tempo_segundos
                - concluido
              properties:
                aluno_id:
                  type: integer
                  example: 1
                atividade_id:
                  type: integer
                  example: 42
                modo_utilizado:
                  type: string
                  example: "Visual Guiado"
                quantidade_erros:
                  type: integer
                  example: 2
                tempo_segundos:
                  type: integer
                  example: 120
                concluido:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Telemetria salva com sucesso
        '400':
          description: Payload corrompido, vazio ou com tipos incorretos
        '500':
          description: Falha operacional no banco de dados

  # --- TAG: ATIVIDADES ---
  /api/modulos:
    get:
      tags:
        - Atividades
      summary: Lista todos os módulos pedagógicos ativos do sistema
      responses:
        '200':
          description: Lista de módulos carregada com sucesso
        '500':
          description: Erro interno

  /api/fase/{modulo_id}/aluno/{aluno_id}:
    get:
      tags:
        - Atividades
      summary: Carrega as fases adaptativas do jogo com base no perfil e personalização do aluno
      parameters:
        - name: modulo_id
          in: path
          required: true
          schema:
            type: integer
          example: 2
        - name: aluno_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Fases e mídias montadas com sucesso para o motor do jogo
        '404':
          description: Aluno não cadastrado ou módulo sem atividades associadas
        '500':
          description: Erro na montagem da fase

  # --- TAG: PROFESSORES ---
  /api/login:
    post:
      tags:
        - Professors
      summary: Realiza o login administrativo do professor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  example: "ana.paula@escola.com"
                senha:
                  type: string
                  example: "senhaSegura123"
      responses:
        '200':
          description: Autenticação administrativa concedida
        '400':
          description: E-mail ou senha ausentes
        '401':
          description: Credenciais incorretas
        '500':
          description: Erro interno

  /api/desempenho/aluno/{aluno_id}:
    get:
      tags:
        - Professors
      summary: Coleta o histórico completo de desempenho de um aluno para o dashboard
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Histórico cronológico decrescente retornado com sucesso
        '500':
          description: Erro interno no servidor

  /api/alunos/{id}:
    delete:
      tags:
        - Professors
      summary: Remove o registro de um aluno do sistema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Aluno desvinculado com sucesso
        '500':
          description: Erro interno

  # --- TAG: RELATORIOS (BI) ---
  /api/relatorios/visao-geral:
    get:
      tags:
        - Relatorios
      summary: Visão geral agregada de toda a plataforma
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Totais, taxas de conclusão e distribuição por modo de aprendizagem
        '500':
          description: Erro interno

  /api/relatorios/professor/{professor_id}:
    get:
      tags:
        - Relatorios
      summary: Dashboard consolidado de todos os alunos de um professor
      security:
        - bearerAuth: []
      parameters:
        - name: professor_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Ranking de XP, distribuição por modo e alunos com possível dificuldade
        '404':
          description: Nenhum aluno encontrado para este professor
        '500':
          description: Erro interno

  /api/relatorios/aluno/{aluno_id}:
    get:
      tags:
        - Relatorios
      summary: Relatório individual de evolução do aluno ao longo do tempo
      security:
        - bearerAuth: []
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Resumo de desempenho e evolução diária
        '404':
          description: Aluno não encontrado
        '500':
          description: Erro interno

  /api/relatorios/modulo/{modulo_id}:
    get:
      tags:
        - Relatorios
      summary: Relatório pedagógico de um módulo (dificuldade por atividade)
      security:
        - bearerAuth: []
      parameters:
        - name: modulo_id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Estatísticas por atividade e ranking das mais difíceis
        '404':
          description: Nenhuma atividade encontrada para este módulo
        '500':
          description: Erro interno

  /alunos/preferencias-jogos:
    get:
      tags: [Alunos]
      summary: Consulta as preferências dos jogos do aluno autenticado
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Preferências individuais ou padrões
        '503':
          description: Migração ou cliente administrativo indisponível
  /professores/alunos/{aluno_id}/preferencias-jogos:
    parameters:
      - name: aluno_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      tags: [Professores]
      summary: Consulta preferências de um aluno do professor autenticado
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Preferências individuais ou padrões}
        '403': {description: Aluno não pertence ao professor}
    patch:
      tags: [Professores]
      summary: Altera preferências individuais sem modificar o nível TEA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pieceCount: {type: integer, nullable: true, enum: [null, 2, 4, 6]}
                showHints: {type: boolean}
                memoryPreviewSeconds: {type: integer, enum: [3, 5, 8, 10]}
                advanceDelaySeconds: {type: integer, enum: [1, 2, 3, 5]}
      responses:
        '200': {description: Preferências salvas}
        '400': {description: Dados inválidos}
        '403': {description: Aluno não pertence ao professor}
        '503': {description: Migração ou cliente administrativo indisponível}
  /relatorios/aluno/{aluno_id}/palavras:
    get:
      tags: [Relatorios]
      summary: Evidências reais por palavra do aluno ou de seu professor
      security: [{bearerAuth: []}]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Lista de palavras com acertos, erros, ajudas e última prática}
        '403': {description: Acesso não autorizado ao aluno}
        '503': {description: Migração ou cliente administrativo indisponível}
  /alunos/desempenho:
    post:
      tags: [Alunos]
      summary: Compatibilidade com o salvamento autenticado de progresso
      deprecated: true
      description: Usa a mesma transação de /atividades/progresso. O aluno é identificado pelo token.
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Progresso salvo com recompensa atômica}
        '200': {description: Repetição idempotente ou revisão sem XP adicional}
        '401': {description: Token ausente ou inválido}
        '403': {description: Tentativa de registrar para outro aluno}
        '503': {description: Migração ou cliente administrativo indisponível}

  /professores/alunos/{aluno_id}/exportacao-dados:
    post:
      tags: [Professores]
      summary: Exportar cadastro e histórico após verificação manual do solicitante
      security: [{bearerAuth: []}]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [solicitante, verificacao_confirmada]
              properties:
                solicitante: {type: string, enum: [titular, responsavel]}
                verificacao_confirmada: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Cadastro atual, suporte TEA e histórico do aluno. Resposta sem cache e sem credenciais.
          content:
            application/json:
              schema:
                type: object
                required: [versao, exportacao, cadastro, historico_atividades]
                properties:
                  versao: {type: integer, enum: [1]}
                  exportacao: {type: object}
                  cadastro: {type: object}
                  historico_atividades: {type: array, items: {type: object}}
        '400': {description: Confirmação ausente ou corpo inválido}
        '401': {description: Token ausente ou inválido}
        '403': {description: Perfil sem permissão ou aluno de outro professor}
        '422': {description: Histórico excede o limite de 50000 registros}
        '503': {description: Exportação indisponível, sem resposta parcial}

  /professores/alunos/{aluno_id}/relatorio-dados.pdf:
    post:
      tags: [Professores]
      summary: Gerar relatório PDF do aluno após verificação manual do solicitante
      description: Usa o mesmo controle de acesso da exportação JSON. Inclui cadastro atual, resumo dos registros, nomes das atividades e módulos, histórico e identificação da emissão. Até 500 registros, sem truncar. Geração em memória, sem armazenamento no servidor.
      security: [{bearerAuth: []}]
      parameters:
        - name: aluno_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [solicitante, verificacao_confirmada]
              properties:
                solicitante: {type: string, enum: [titular, responsavel]}
                verificacao_confirmada: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Download PDF com paginação e resposta privada sem cache. Sem PIN ou credenciais.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {description: Confirmação ausente ou corpo inválido}
        '401': {description: Token ausente ou inválido}
        '403': {description: Perfil sem permissão ou aluno de outro professor}
        '422': {description: Histórico excede 500 registros. Usar a exportação JSON}
        '503': {description: Falha na consulta ou geração. Nenhum PDF parcial é entregue}

  /privacidade/atendimento:
    get:
      tags: [Privacidade]
      summary: Consultar disponibilidade, responsável e canal oficial
      description: Disponível somente quando a instituição configura os três parâmetros de atendimento. Não retorna dados de alunos.
      responses:
        '200':
          description: Configuração pública do atendimento, sem cache
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel: {type: boolean}
                  responsavel: {type: string, nullable: true}
                  contato: {type: string, nullable: true}
  /alunos/solicitacoes-dados:
    get:
      tags: [Privacidade]
      summary: Aluno ativo acompanha somente seus próprios pedidos
      security: [{bearerAuth: []}]
      parameters:
        - {name: antes, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Até 50 solicitações com protocolo e eventos, e proximo_cursor para continuar}
        '400': {description: Cursor ou parâmetro inválido}
        '401': {description: Sessão ausente ou inválida}
        '403': {description: Perfil incorreto ou conta desativada}
        '503': {description: Armazenamento indisponível}
  /professores/alunos/{aluno_id}/solicitacoes-dados:
    parameters:
      - {name: aluno_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Privacidade]
      summary: Professor acompanha os pedidos de um aluno vinculado
      security: [{bearerAuth: []}]
      parameters:
        - {name: antes, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Até 50 solicitações com protocolo, eventos e proximo_cursor}
        '400': {description: Cursor ou parâmetro inválido}
        '401': {description: Sessão ausente ou inválida}
        '403': {description: Perfil incorreto ou aluno de outra turma}
        '503': {description: Armazenamento indisponível}
    post:
      tags: [Privacidade]
      summary: Registrar pedido verificado sem executar correção ou exclusão
      description: O cliente mantém o mesmo UUID v4 ao repetir uma tentativa sem resposta. O servidor nunca sobrescreve um pedido já registrado. Exige atendimento institucional configurado.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, tipo, descricao, solicitante, verificacao_confirmada]
              properties:
                id: {type: string, format: uuid}
                tipo: {type: string, enum: [correcao, exclusao]}
                descricao: {type: string, minLength: 10, maxLength: 2000}
                solicitante: {type: string, enum: [titular, responsavel]}
                verificacao_confirmada: {type: boolean, enum: [true]}
      responses:
        '201': {description: Solicitação recebida com protocolo e evento de abertura}
        '200': {description: Mesma solicitação já registrada, sem duplicação}
        '400': {description: Campos ou confirmação inválidos}
        '401': {description: Sessão ausente ou inválida}
        '403': {description: Perfil incorreto ou aluno de outra turma}
        '409': {description: Identificador utilizado em outro pedido}
        '503': {description: Atendimento não configurado ou armazenamento indisponível}
  /professores/alunos/{aluno_id}/solicitacoes-dados/{solicitacao_id}:
    patch:
      tags: [Privacidade]
      summary: Iniciar análise ou registrar resposta final visível ao aluno
      description: Versão obrigatória para evitar sobrescrita. Um pedido respondido não pode ser reaberto. A rota registra a decisão, sem alterar ou excluir dados do aluno.
      security: [{bearerAuth: []}]
      parameters:
        - {name: aluno_id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: solicitacao_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, resposta, versao]
              properties:
                status: {type: string, enum: [em_analise, respondida]}
                resposta: {type: string, maxLength: 2000, description: Vazia ao iniciar análise; mínimo 10 caracteres para resposta final}
                versao: {type: integer, minimum: 1}
      responses:
        '200': {description: Status e evento registrados na mesma transação}
        '400': {description: Campos ou resposta inválidos}
        '401': {description: Sessão ausente ou inválida}
        '403': {description: Perfil incorreto ou aluno de outra turma}
        '404': {description: Solicitação indisponível para o aluno}
        '409': {description: Versão desatualizada, transição repetida ou pedido já respondido}
        '503': {description: Atendimento não configurado ou armazenamento indisponível}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
